<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resim → PDF Dönüştürücü</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        #dropzone {
            border: 3px dashed #ccc;
            border-radius: 12px;
            padding: 3rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
        }
        #dropzone:hover, #dropzone.dragover {
            border-color: #667eea;
            background: #f0f0ff;
        }
        #dropzone .icon { font-size: 4rem; margin-bottom: 1rem; }
        #dropzone h3 { color: #333; margin-bottom: 0.5rem; }
        #dropzone p { color: #888; font-size: 0.9rem; }
        
        #preview {
            margin-top: 1.5rem;
            display: none;
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .preview-header span { color: #666; font-size: 0.9rem; }
        #clearBtn {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 0.9rem;
        }
        #clearBtn:hover { text-decoration: underline; }
        
        #thumbs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            padding: 5px;
        }
        .thumb {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #eee;
        }
        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .thumb .num {
            position: absolute;
            bottom: 4px;
            left: 4px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .thumb .del {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            background: rgba(231, 76, 60, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .thumb .del:hover { background: #c0392b; }
        
        #options {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }
        #options label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 0.5rem;
        }
        #options select, #options input[type="checkbox"] {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        
        #convertBtn {
            margin-top: 1.5rem;
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #convertBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        #convertBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        #progress {
            margin-top: 1rem;
            display: none;
        }
        .progress-bar {
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }
        #progressText {
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }
        
        .success {
            margin-top: 1rem;
            padding: 1rem;
            background: #d4edda;
            color: #155724;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📷 Resim → PDF Dönüştürücü</h1>
        <p class="subtitle">İSG notlarını tek PDF'e çevir</p>
        
        <div id="dropzone">
            <div class="icon">📁</div>
            <h3>Resimleri buraya sürükle veya tıkla</h3>
            <p>PNG, JPG, JPEG, WEBP — sınırsız dosya</p>
            <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
        </div>
        
        <div id="preview">
            <div class="preview-header">
                <span><strong id="count">0</strong> resim seçildi (sürükleyerek sıralayabilirsin)</span>
                <button id="clearBtn">Tümünü temizle</button>
            </div>
            <div id="thumbs"></div>
        </div>
        
        <div id="options">
            <label>
                Sayfa boyutu:
                <select id="pageSize">
                    <option value="a4">A4 (önerilen)</option>
                    <option value="letter">Letter</option>
                    <option value="fit">Resme sığdır</option>
                </select>
            </label>
            <label>
                <input type="checkbox" id="compress" checked>
                Sıkıştır (daha küçük dosya boyutu)
            </label>
        </div>
        
        <button id="convertBtn" disabled>🚀 PDF Oluştur ve İndir</button>
        
        <div id="progress">
            <div class="progress-bar">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
            <p id="progressText">Hazırlanıyor...</p>
        </div>
        
        <div class="success" id="success">
            ✅ PDF başarıyla oluşturuldu ve indirildi!
        </div>
    </div>

    <script>
        const { jsPDF } = window.jspdf;
        let files = [];
        
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const thumbs = document.getElementById('thumbs');
        const count = document.getElementById('count');
        const options = document.getElementById('options');
        const convertBtn = document.getElementById('convertBtn');
        const progress = document.getElementById('progress');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const clearBtn = document.getElementById('clearBtn');
        const success = document.getElementById('success');
        
        // Event listeners
        dropzone.addEventListener('click', () => fileInput.click());
        
        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });
        
        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });
        
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            addFiles(e.dataTransfer.files);
        });
        
        fileInput.addEventListener('change', (e) => {
            addFiles(e.target.files);
            fileInput.value = '';
        });
        
        clearBtn.addEventListener('click', () => {
            files = [];
            updatePreview();
        });
        
        function addFiles(newFiles) {
            for (const f of newFiles) {
                if (f.type.startsWith('image/')) {
                    files.push(f);
                }
            }
            updatePreview();
        }
        
        function updatePreview() {
            success.style.display = 'none';
            
            if (files.length === 0) {
                preview.style.display = 'none';
                options.style.display = 'none';
                convertBtn.style.display = 'none';
                return;
            }
            
            preview.style.display = 'block';
            options.style.display = 'block';
            convertBtn.style.display = 'block';
            convertBtn.disabled = false;
            count.textContent = files.length;
            
            thumbs.innerHTML = '';
            files.forEach((f, i) => {
                const div = document.createElement('div');
                div.className = 'thumb';
                div.draggable = true;
                div.dataset.index = i;
                
                const img = document.createElement('img');
                img.src = URL.createObjectURL(f);
                
                const num = document.createElement('span');
                num.className = 'num';
                num.textContent = i + 1;
                
                const del = document.createElement('button');
                del.className = 'del';
                del.innerHTML = '×';
                del.onclick = (e) => {
                    e.stopPropagation();
                    files.splice(i, 1);
                    updatePreview();
                };
                
                div.appendChild(img);
                div.appendChild(num);
                div.appendChild(del);
                thumbs.appendChild(div);
                
                // Drag and drop for reordering
                div.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', i);
                    div.style.opacity = '0.5';
                });
                
                div.addEventListener('dragend', () => {
                    div.style.opacity = '1';
                });
                
                div.addEventListener('dragover', (e) => {
                    e.preventDefault();
                });
                
                div.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
                    const toIndex = i;
                    if (fromIndex !== toIndex) {
                        const item = files.splice(fromIndex, 1)[0];
                        files.splice(toIndex, 0, item);
                        updatePreview();
                    }
                });
            });
        }
        
        convertBtn.addEventListener('click', async () => {
            if (files.length === 0) return;
            
            convertBtn.disabled = true;
            progress.style.display = 'block';
            progressBar.style.width = '0%';
            success.style.display = 'none';
            
            const pageSize = document.getElementById('pageSize').value;
            const compress = document.getElementById('compress').checked;
            
            const sizes = {
                a4: [210, 297],
                letter: [215.9, 279.4],
                fit: null
            };
            
            let pdf = null;
            
            if (pageSize !== 'fit') {
                pdf = new jsPDF({
                    unit: 'mm',
                    format: sizes[pageSize]
                });
            }
            
            for (let i = 0; i < files.length; i++) {
                progressText.textContent = `İşleniyor: ${i + 1} / ${files.length}`;
                progressBar.style.width = `${((i + 1) / files.length) * 100}%`;
                
                const imgData = await readFile(files[i], compress);
                const img = await loadImage(imgData);
                
                if (pageSize === 'fit') {
                    const w = img.width * 0.264583;
                    const h = img.height * 0.264583;
                    
                    if (!pdf) {
                        pdf = new jsPDF({ unit: 'mm', format: [w, h] });
                    } else {
                        pdf.addPage([w, h]);
                    }
                    pdf.addImage(imgData, 'JPEG', 0, 0, w, h);
                } else {
                    if (i > 0) pdf.addPage();
                    
                    const pageW = pdf.internal.pageSize.getWidth();
                    const pageH = pdf.internal.pageSize.getHeight();
                    const margin = 10;
                    const maxW = pageW - margin * 2;
                    const maxH = pageH - margin * 2;
                    
                    let w = img.width * 0.264583;
                    let h = img.height * 0.264583;
                    const ratio = Math.min(maxW / w, maxH / h, 1);
                    w *= ratio;
                    h *= ratio;
                    
                    const x = (pageW - w) / 2;
                    const y = (pageH - h) / 2;
                    
                    pdf.addImage(imgData, 'JPEG', x, y, w, h);
                }
            }
            
            pdf.save('isg_notlari.pdf');
            
            progressText.textContent = 'Tamamlandı!';
            success.style.display = 'block';
            convertBtn.disabled = false;
            
            setTimeout(() => {
                progress.style.display = 'none';
            }, 2000);
        });
        
        function readFile(file, compress) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    if (compress) {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const maxDim = 1600;
                            let w = img.width, h = img.height;
                            
                            if (w > maxDim || h > maxDim) {
                                const ratio = Math.min(maxDim / w, maxDim / h);
                                w *= ratio;
                                h *= ratio;
                            }
                            
                            canvas.width = w;
                            canvas.height = h;
                            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                            resolve(canvas.toDataURL('image/jpeg', 0.85));
                        };
                        img.src = e.target.result;
                    } else {
                        resolve(e.target.result);
                    }
                };
                reader.readAsDataURL(file);
            });
        }
        
        function loadImage(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.src = src;
            });
        }
    </script>
</body>
</html>
