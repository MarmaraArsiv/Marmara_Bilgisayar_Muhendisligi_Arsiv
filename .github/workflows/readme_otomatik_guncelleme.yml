name: README Otomatik Güncelleme

on:
  # PR merge edilince main'e push düşer; fork PR'larında da yazma izni olsun diye push kullanılıyor.
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"    # her gün 09:00 (TR): tam güncelleme
    # 5 dakikada bir sadece form cevaplarına bakar: Telegram'dan onaylanan yorumlar ~10-15 dk içinde yayına girer.
    # Değişiklik yoksa commit atmadan kapanır.
    # Saat başlarında GitHub yoğun olduğu için dakikalar kaydırıldı (4, 9, 14, ...).
    - cron: "4-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: readme-otomatik
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Katkıda bulunanları hesapla
        if: github.event.schedule != '4-59/5 * * * *'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/katkida_bulunanlari_guncelle.py

      - name: Doluluk durumunu üret
        if: github.event.schedule != '4-59/5 * * * *'
        run: python .github/scripts/readme_gorselleri.py

      - name: Form linkleri, oylar ve onaylı yorumlar
        run: python .github/scripts/form_linkleri.py

      - name: Değişiklik varsa commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- json_dosyalari/katkida_bulunanlar.json '*README.md'
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git commit -m "README otomatik güncellendi"
          git pull --rebase -q
          git push
